name: Android CI & Build

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Pilih tipe build'
        required: true
        default: 'debug'
        type: choice
        options:
          - 'debug'
          - 'release'
          - 'all'
      run_tests:
        description: 'Jalankan Unit Test sebelum build'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Environment Variables (.env)
        run: |
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          # Inject GEMINI_API_KEY if secret exists in GitHub Repository Secrets
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          fi

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Debug keystore extracted from debug.keystore.base64"
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "New debug keystore generated."
          fi

      - name: Setup Release Keystore (if provided in GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
            echo "Release keystore configured from secret."
          fi

      - name: Run Unit Tests
        if: ${{ github.event.inputs.run_tests != 'false' }}
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Build Debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_variant == 'debug' || github.event.inputs.build_variant == 'all' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_variant == 'release' || github.event.inputs.build_variant == 'all')) }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          # If release keystore doesn't exist, fallback to debug keystore for signing release
          if [ ! -f "my-upload-key.jks" ]; then
            cp debug.keystore my-upload-key.jks
            export STORE_PASSWORD=android
            export KEY_PASSWORD=android
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Build Release Bundle (AAB)
        if: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_variant == 'release' || github.event.inputs.build_variant == 'all')) }}
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            cp debug.keystore my-upload-key.jks
            export STORE_PASSWORD=android
            export KEY_PASSWORD=android
          fi
          ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.build_variant == 'debug' || github.event.inputs.build_variant == 'all') }}
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK & Bundle Artifacts
        if: ${{ (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_variant == 'release' || github.event.inputs.build_variant == 'all')) }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Test Reports
        if: ${{ failure() && github.event.inputs.run_tests != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
